[package]
name = "agave-rpc-bench"
description = "Benchmark of JSON RPC serving, including simulateTransaction"
publish = false
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
workspace = "../dev-bins"

[features]
agave-unstable-api = []

[dependencies]
agave-logger = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rand_chacha = { workspace = true }
serde_json = { workspace = true }
solana-account = { workspace = true }
solana-accounts-db = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-entry = { workspace = true }
solana-epoch-schedule = { workspace = true }
solana-fee-calculator = { workspace = true }
solana-gossip = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-leader-schedule = { workspace = true }
solana-ledger = { workspace = true, features = ["dev-context-only-utils"] }
solana-net-utils = { workspace = true }
solana-program-binaries = { workspace = true }
solana-program-pack = { workspace = true }
solana-pubkey = { workspace = true }
solana-rent = { workspace = true }
solana-rpc = { workspace = true, features = ["dev-context-only-utils"] }
solana-rpc-client-api = { workspace = true }
solana-runtime = { workspace = true, features = ["dev-context-only-utils"] }
solana-sdk-ids = { workspace = true }
solana-send-transaction-service = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-system-transaction = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-unified-scheduler-pool = { workspace = true, features = ["dev-context-only-utils"] }
spl-associated-token-account-interface = { workspace = true }
spl-memo-interface = { workspace = true }
spl-token-2022-interface = { workspace = true }
spl-token-interface = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
wincode = { workspace = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Use the ARMv8 SHA-2 instructions in sha2 0.10, as agave-validator does on
# aarch64. sha2 checks the CPU at run time and falls back to software.
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(target_os = "linux")'.dependencies]
agave-cpu-utils = { workspace = true }
solana-clap-utils = { workspace = true }

[target.'cfg(not(any(target_env = "msvc", target_os = "freebsd")))'.dependencies]
jemallocator = { workspace = true }

[lints]
workspace = true
