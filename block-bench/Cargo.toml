[package]
name = "agave-block-bench"
description = "Benchmark for receiving and replaying Alpenglow blocks"
publish = false
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
agave-unstable-api = []

[dependencies]
agave-feature-set = { workspace = true }
agave-logger = { workspace = true }
agave-votor-messages = { workspace = true }
agave-worker-pool = { workspace = true }
bitvec = { workspace = true }
clap = { version = "3.2.23", default-features = false, features = ["cargo", "std", "suggestions"] }
jemallocator = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
solana-account = { workspace = true }
solana-accounts-db = { workspace = true }
solana-bls-signatures = { workspace = true }
solana-clock = { workspace = true }
solana-cluster-type = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-entry = { workspace = true }
solana-epoch-schedule = { workspace = true }
solana-fee-calculator = { workspace = true }
solana-genesis-config = { workspace = true }
solana-hash = { workspace = true }
solana-keypair = { workspace = true }
solana-ledger = { workspace = true }
solana-message = { workspace = true }
solana-perf = { workspace = true }
solana-program-binaries = { workspace = true }
solana-program-pack = { workspace = true }
solana-pubkey = { workspace = true }
solana-rent = { workspace = true }
solana-runtime = { workspace = true }
solana-runtime-transaction = { workspace = true }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
solana-shred-version = { workspace = true }
solana-signer = { workspace = true }
solana-signer-store = { workspace = true }
solana-svm-timings = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-unified-scheduler-pool = { workspace = true }
spl-associated-token-account-interface = { workspace = true }
spl-memo-interface = { workspace = true }
spl-token-2022-interface = { workspace = true }
spl-token-interface = { workspace = true }
tempfile = { workspace = true }
wincode = { workspace = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Use the ARMv8 SHA-2 instructions in sha2 0.10, as agave-validator does on
# aarch64. sha2 checks the CPU at run time and falls back to software.
sha2 = { workspace = true, features = ["asm"] }

[lints]
workspace = true
